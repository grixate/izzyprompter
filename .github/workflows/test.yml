name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - uses: actions/cache@v4
        with:
          path: |
            api/deps
            api/_build
          key: ${{ runner.os }}-beam-28-1.19-${{ hashFiles('api/mix.lock') }}
      - run: npm ci
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
        working-directory: api
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - run: npm run test:security-deps
      - run: npm run test:browsers
      - run: npm run test:offline
      - run: npm run test:release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker build --tag izzy:ci .
      - run: npm run test:container
        env:
          IZZY_CONTAINER_IMAGE: izzy:ci
      - name: Package the tested image for manual promotion
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          commit="$(git rev-parse HEAD)"
          image="izzy:git-$commit"
          docker tag izzy:ci "$image"
          git archive --format=tar "$commit" | gzip -n > release-candidate/source.tar.gz
          docker save "$image" | gzip -n > release-candidate/image.tar.gz
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, tarfile
          root = pathlib.Path('release-candidate')
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          image = 'izzy:git-' + commit
          image_id = subprocess.check_output(['docker', 'image', 'inspect', image, '--format', '{{.Id}}'], text=True).strip()
          checksums = {}
          for name in ('source.tar.gz', 'image.tar.gz'):
              with (root / name).open('rb') as stream:
                  checksums[name] = hashlib.file_digest(stream, 'sha256').hexdigest()
          with tarfile.open(root / 'image.tar.gz', 'r:gz') as archive:
              saved = json.load(archive.extractfile('manifest.json'))[0]
              config_name = saved['Config'].removeprefix('blobs/sha256/').removesuffix('.json')
              oci = json.load(archive.extractfile('index.json')) if 'index.json' in archive.getnames() else None
          record = {'commit': commit, 'image': image, 'image_id': image_id,
                    'config_digest': 'sha256:' + config_name,
                    'oci_manifest_digest': oci['manifests'][0]['digest'] if oci else None,
                    'sha256': checksums}
          (root / 'release.json').write_text(json.dumps(record, indent=2) + '\n')
          (root / 'SHA256SUMS').write_text(''.join(digest + '  ' + name + '\n' for name, digest in checksums.items()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: izzy-candidate-${{ github.run_id }}
          path: release-candidate/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  accounts:
    runs-on: ubuntu-latest
    # Full PostgreSQL/browser matrix plus restore after variable apt mirror latency.
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: izzy
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: izzy_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://izzy:disposable-ci-password@127.0.0.1:5432/izzy_test
      IZZY_E2E_DATABASE_URL: postgresql://izzy:disposable-ci-password@127.0.0.1:5432/izzy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28'
          elixir-version: '1.19'
      - run: npm ci
      - run: mix local.hex --force && mix local.rebar --force && mix deps.get
        working-directory: api
      - run: MIX_ENV=test mix ecto.migrate
        working-directory: api
      - run: mix test
        working-directory: api
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers
        env:
          FEEDBACK_ENABLED: 'true'
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npm run test:restore
        env:
          IZZY_RESTORE_PG_URL: postgresql://izzy:disposable-ci-password@127.0.0.1:5432/postgres
          IZZY_PG_BIN: /usr/lib/postgresql/16/bin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: account-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
